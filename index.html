<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Texto centrado y responsivo</title>
  <style>
    /* Página completa, centrado con flexbox */
    html, body {
      height: 100%;
      margin: 0;
    }

    .center {
      display: flex;
      align-items: center;      /* vertical */
      justify-content: center;  /* horizontal */
      height: 100%;
      background: #202b6b;      /* cambia si querés otro fondo */
    }

    /* Tamaño de fuente responsivo:
       clamp(minimo, preferido relativo al viewport, maximo) */
    .big-text {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      font-weight: 600;
      font-size: clamp(2rem, 14vw, 18rem);
      line-height: 1;
      text-align: center;
      user-select: none;
	  color: #cfcfcf;
    }
  </style>
</head>
<body>
  <div class="center">
    <div class="big-text">Proximamente</div>
  </div>
</body>
</html>
